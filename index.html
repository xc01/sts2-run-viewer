<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>杀戮尖塔2战报可视化</title>
  <style>
    :root {
      --bg: #10161d;
      --panel: #16232c;
      --panel-2: #1e2d36;
      --text: #e6edf2;
      --muted: #aebbc5;
      --gold: #f0c24b;
      --red: #ff5b62;
      --green: #5ee070;
      --line: rgba(255,255,255,.12);
      --shadow: 0 18px 45px rgba(0,0,0,.4);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 30% 10%, rgba(90, 62, 35, .42), transparent 34%),
        linear-gradient(135deg, #0c1017 0%, #121a22 46%, #0b0d12 100%);
      min-height: 100vh;
    }

    .app { width: min(1180px, calc(100vw - 32px)); margin: 0 auto; padding: 24px 0 42px; }
    .title { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 26px; letter-spacing: .04em; color: var(--gold); }
    .sub { color: var(--muted); font-size: 14px; }

    .uploader {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }
    .upload-card {
      background: rgba(22, 35, 44, .82);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .upload-card h2 { margin: 0 0 8px; font-size: 16px; color: var(--gold); }
    .upload-card p { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    input[type="file"] { width: 100%; color: var(--muted); }
    .drop-zone {
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 2px dashed rgba(240, 194, 75, .35);
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .drop-zone.dragover {
      border-color: var(--gold);
      background: rgba(240, 194, 75, .09);
      transform: translateY(-2px);
    }
    .selected-file {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .loading {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 700;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(240, 194, 75, .25);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .back-btn {
      margin: 0 0 18px;
      background: #26364c;
      color: var(--text);
      border: 1px solid rgba(255,255,255,.12);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    button {
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      background: #d4a932;
      color: #111;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }

    .status-line {
      display: grid;
      grid-template-columns: repeat(5, auto) 1fr;
      align-items: center;
      gap: 18px;
      background: rgba(13, 18, 24, .86);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 18px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }
    .stat-label { color: var(--muted); font-size: 12px; display: block; }
    .stat-value { font-size: 18px; font-weight: 800; }
    .hp { color: var(--red); }
    .ok { color: var(--green); }
    .fail { color: var(--red); }
    .seed { color: var(--gold); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    .acts {
      background: rgba(13, 18, 24, .72);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .act-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .act-row:last-child { border-bottom: 0; }
    .act-name { color: var(--gold); font-weight: 800; }
    .nodes { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; padding: 12px 0; }
    .node {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--panel-2);
      border: 1px solid rgba(255,255,255,.1);
      cursor: default;
      position: relative;
      font-size: 21px;
      transition: transform .12s ease, filter .12s ease;
    }
    .node:hover { transform: translateY(-3px) scale(1.04); filter: brightness(1.18); z-index: 10; }
    .node.monster { background: #293022; }
    .node.elite { background: #3a2437; }
    .node.boss { background: #432326; }
    .node.shop { background: #213728; }
    .node.treasure { background: #26364c; }
    .node.rest_site { background: #3a2b20; }
    .node.event, .node.unknown, .node.ancient { background: #2f2f25; }

    .tooltip {
      position: fixed;
      width: 290px;
      max-width: min(290px, calc(100vw - 24px));
      background: rgba(16, 28, 36, .97);
      border: 1px solid rgba(180, 210, 220, .25);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      box-shadow: 0 16px 40px rgba(0,0,0,.55);
      pointer-events: none;
      display: none;
      z-index: 9999;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-line;
    }
    .tooltip .floor { color: var(--gold); font-weight: 800; margin-bottom: 4px; }
    .tooltip .k { color: var(--gold); font-weight: 800; }
    .tooltip .choice { color: #dbe8ef; }
    .tooltip .skip { color: #bcc8d0; }

    .collections {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .collection {
      background: rgba(13, 18, 24, .78);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }
    .collection h2 { margin: 0 0 12px; font-size: 17px; color: var(--gold); }
    .pill-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 13px;
      color: #dce6ea;
    }
    .empty { color: var(--muted); font-size: 14px; }
    .error { color: #ffb1b5; margin-top: 10px; font-size: 13px; }

    @media (max-width: 760px) {
      .collections { grid-template-columns: 1fr; }
      .status-line { grid-template-columns: 1fr 1fr; }
      .act-row { grid-template-columns: 48px 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="title">
      <div>
        <h1>杀戮尖塔2战报可视化</h1>
        <div class="sub">上传战报 JSON / TXT，并上传翻译 JSON 文件，即可生成路线、悬浮说明、遗物与卡牌列表。</div>
      </div>
    </div>

    <section class="uploader single-uploader">
      <div id="dropZone" class="upload-card drop-zone">
        <h2>上传战报</h2>
        <p>把战报 JSON / TXT 拖到这里，或点击选择文件。</p>
        <input id="runFile" type="file" accept=".run,.json,.txt,application/json,text/plain" />
        <button id="renderBtn">生成 UI</button>
        <div id="loading" class="loading" style="display:none">
          <span class="spinner"></span>
          <span>正在生成 UI...</span>
        </div>
        <div id="selectedFile" class="selected-file">尚未选择文件</div>
        <div id="error" class="error"></div>
      </div>
    </section>

    <button id="backBtn" class="back-btn" style="display:none">返回</button>

    <section id="statusLine" class="status-line" style="display:none"></section>
    <section id="acts" class="acts" style="display:none"></section>

    <section id="collections" class="collections" style="display:none">
      <div class="collection">
        <h2>遗物</h2>
        <div id="relics" class="pill-list"></div>
      </div>
      <div class="collection">
        <h2>卡牌</h2>
        <div id="cards" class="pill-list"></div>
      </div>
    </section>
  </main>

  <div id="tooltip" class="tooltip"></div>

  <script>
    const ICONS = {
      ancient: "🦴",
      monster: "👹",
      elite: "💀",
      boss: "👑",
      shop: "💰",
      treasure: "💎",
      rest_site: "🔥",
      event: "❓",
      unknown: "❓"
    };

    const TYPE_NAME = {
      ancient: "先古之民",
      monster: "普通怪",
      elite: "精英",
      boss: "首领",
      shop: "商店",
      treasure: "宝箱",
      rest_site: "休息点",
      event: "事件",
      unknown: "未知"
    };

    let reportData = null;
    let translations = new Map();

    const TRANSLATION_FILES = [
      "sts2_card_translations.json",
      "sts2_events.json",
      "sts2_misc_ancient_rewards.json",
      "sts2_misc_card_types.json",
      "sts2_misc_characters.json",
      "sts2_misc_powers.json",
      "sts2_misc_rest_sites.json",
      "sts2_misc_tooltips.json",
      "sts2_monsters.json",
      "sts2_potions.json",
      "sts2_relics.json"
    ];

    const $ = (id) => document.getElementById(id);

mal|elite|boss)$/i, "");
    }

    function addTranslationKey(key, value) {
      if (!key || value == null) return;
      const zh = typeof value === "string" ? value : value.name || value.title || value.text || value.zh || value["zh-CN"];
      if (!zh || typeof zh !== "string") return;
      const nk = normalizeKey(key);
      translations.set(nk, zh);
      translations.set(normalizeKey(String(key).replace(/_/g, " ")), zh);
      translations.set(compactKey(key), zh);
      translations.set(withoutEncounterMarker(key), zh);
      translations.set(compactKey(withoutEncounterMarker(key)), zh);
    }

    function flattenTranslations(obj, prefix = "") {
      if (!obj || typeof obj !== "object") return;
      for (const [key, value] of Object.entries(obj)) {
        addTranslationKey(key, value);
        if (value && typeof value === "object" && !Array.isArray(value)) {
          if (value.name) addTranslationKey(key, value.name);
          if (value.title) addTranslationKey(key, value.title);
          flattenTranslations(value, key);
        }
      }
    }

    function lookupTranslation(key) {
      const candidates = unique([
        normalizeKey(key),
        normalizeKey(String(key).replace(/_/g, " ")),
        compactKey(key),
        withoutEncounterMarker(key),
        compactKey(withoutEncounterMarker(key))
      ]);
      for (const c of candidates) {
        if (translations.has(c)) return translations.get(c);
      }
      return null;
    }

    function prettifyRaw(raw) {
      return String(raw)
        .replace(/^CARD[.]/i, "")
        .replace(/^RELIC[.]/i, "")
        .replace(/^POTION[.]/i, "")
        .replace(/^MONSTER[.]/i, "")
        .replace(/^ENCOUNTER[.]/i, "")
        .replace(/^EVENT[.]/i, "")
        .replace(/^CHARACTER[.]/i, "")
        .replace(/_/g, " ")
        .toLowerCase()
        .split(" ")
        .map(word => word ? word[0].toUpperCase() + word.slice(1) : word)
        .join(" ");
    }

    function t(raw) {
      if (raw == null) return "";
      let key = String(raw);
      if (key.includes(".")) {
        const parts = key.split(".");
        key = parts[parts.length - 1] === "title"unction readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsText(file);
      });
    }

    async function loadTranslationFiles(files) {
      translations = new Map();

      if (files && files.length) {
        for (const file of files) {
          const text = await readFileAsText(file);
          try {
            const json = JSON.parse(text);
            flattenTranslations(json);
          } catch (e) {
            console.warn(`翻译文件解析失败：${file.name}`, e);
          }
        }
        return;
      }

      const failed = [];
      for (const name of TRANSLATION_FILES) {
        try {
          const response = await fetch(`data/${name}`);
          if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
          const json = await response.json();
          flattenTranslations(json);
        } catch (e) {
          failed.push(name);
          console.warn(`自动读取翻译文件失败：data/${name}`, e);
        }
      }

      if (failed.length === TRANSLATION_FILES.length) {
        throw new Error("没有读取到翻译文件。请确认这些 JSON 文件位于仓库的 data 文件夹中，或在页面上手动上传翻译文件。");
      }
    }

    function parseJsonLikeText(text) {
      const trimmed = text.trim();
      try { return JSON.parse(trimmed); } catch (_) {}
      const start = trimmed.indexOf("{");
      const end = trimmed.lastIndexOf("}");
      if (start >= 0 && end > start) return JSON.parse(trimmed.slice(start, end + 1));
      throw new Error("无法解析战报文件，请确认文件内容是 JSON。 ");
    }

    function getPickedCardChoices(stats) {
      return (stats.card_choices || [])
        .filter(x => x.was_picked)
        .map(x => cardLabel(x.card));
    }

    function getSkippedCardChoices(stats) {
      return (stats.card_choices || [])
        .filter(x => !x.was_picked)
        .map(x => cardLabel(x.card));
    }

    function getPickedRelics(stats) {
      return [
        ...(stats.relic_choices || []).filter(x => x.was_picked).map(x => t(x.choice)),
        ...(stats.bought_relics || []).map(t)
      ];
    }

    function getSkippedRelics(stats) {
      return (stats.relic_choices || []).filter(x => !x.was_picked).map(x => t(x.choice));
    }

    function getPickedPotions(stats) {
      return [
        ...(stats.potion_choices || []).filter(x => x.was_picked).map(x => t(x.choice)),
        ...(stats.bought_potions || []).map(t),
        ...(stats.potion_used || []).map(x => `使用${t(x)}`)
      ];
    }

    function getSkippedPotions(stats) {
      return (stats.potion_choices || []).filter(x => !x.was_picked).map(x => t(x.choice));
    }

    function getAncientChoices(stats) {
      const picked = [];
      const skipped = [];
      for (const x of stats.ancient_choice || []) {
        const name = t(x.TextKey || (x.title && x.title.key));
        (x.was_chosen ? picked : skipped).push(name);
      }
      return { picked, skipped };
    }

    function eventChoiceNames(stats) {
      return (stats.event_choices || []).map(x => {
        const title = x.title && x.title.key ? t(x.title.key) : "事件选项";
        return title;
      });
    }

    function unique(arr) {
      return [...new Set(arr.filter(Boolean))];
    }

    function cardLabel(cardOrId) {
      if (!cardOrId) return "";
      const card = typeof cardOrId === "string" ? { id: cardOrId } : cardOrId;
      const name = t(card.id || card.card_id || card.name || card);
      const level = Number(card.current_upgrade_level || card.upgrade_level || card.upgrades || 0);
      return level > 0 ? `${name}+${level > 1 ? level : ""}` : name;
    }

    function rewardNames(stats) {
      return unique([
        ...(stats.cards_gained || []).map(cardLabel),
        ...(stats.relic_choices || []).filter(x => x.was_picked).map(x => t(x.choice)),
        ...(stats.bought_relics || []).map(t),
        ...(stats.potion_choices || []).filter(x => x.was_picked).map(x => t(x.choice)),
        ...(stats.bought_potions || []).map(t),
        ...(stats.upgraded_cards || []).map(x => `升级${t(x)}`),
        ...(stats.cards_transformed || []).map(x => `${cardLabel(x.original_card)} → ${cardLabel(x.final_card)}`),
        ...(stats.cards_enchanted || []).map(x => `${cardLabel(x.card)} 获得${t(x.enchantment)}附魔`)
      ]);
    }

    function lostNames(stats) {
      return unique([
        ...(stats.cards_removed || []).map(x => `移除${cardLabel(x)}`),
        ...(stats.relics_removed || []).map(x => `失去${t(x)}`),
        ...(stats.max_hp_lost > 0 ? [`最大生命 -${stats.max_hp_lost}`] : []),
        ...(stats.gold_spent > 0 ? [`花费 ${stats.gold_spent} 金币`] : [])
      ]);
    }

    function summarizeNode(node, actIndex, floorNumber, data) {
      const stats = (node.player_stats && node.player_stats[0]) || {};
      const room = (node.rooms && node.rooms[0]) || {};
      const type = node.map_point_type || room.room_type || "unknown";
      const isEventNode = room.room_type === "event" || ["event", "unknown", "ancient"].includes(type);
      const encounter = room.model_id ? tEncounter(room.model_id) : TYPE_NAME[type] || type;
      const turns = room.turns_taken || 0;
      const hp = `${stats.current_hp ?? "?"}/${stats.max_hp ?? "?"}`;
      const gold = stats.current_gold ?? "?";

      const ancient = getAncientChoices(stats);
      const picked = unique([
        ...ancient.picked,
        ...getPickedCardChoices(stats),
        ...getPickedRelics(stats),
        ...getPickedPotions(stats),
        ...(stats.potion_used || []).map(x => `使用${t(x)}`),
        ...(stats.rest_site_choices || []).map(x => t(x))
      ]);

      const skipped = unique([
        ...ancient.skipped,
        ...getSkippedCardChoices(stats),
        ...getSkippedRelics(stats),
        ...getSkippedPotions(stats)
      ]);

      const rewards = rewardNames(stats);
      const lost = lostNames(stats);

      if (isEventNode) {
        return {
          type,
          floor: floorNumber,
          act: actIndex + 1,
          mode: "event",
          event: encounter,
          chose: unique([...eventChoiceNames(stats), ...picked]).join("、") || "无",
          reward: rewards.join("、") || "无",
          lost: lost.join("、") || "无"
        };
      }

      const contentParts = [];
      contentParts.push(`${TYPE_NAME[type] || type}：${encounter}`);
      if (["monster", "elite", "boss"].includes(type)) contentParts.push(`${turns} 回合结束`);
      if (stats.damage_taken > 0) contentParts.push(`受到 ${stats.damage_taken} 点伤害`);
      else if (["monster", "elite", "boss"].includes(type)) contentParts.push("无伤");
      if (stats.hp_healed > 0) contentParts.push(`恢复 ${stats.hp_healed} 点生命`);
      if (stats.max_hp_gained > 0) contentParts.push(`最大生命 +${stats.max_hp_gained}`);
      if (stats.max_hp_lost > 0) contentParts.push(`最大生命 -${stats.max_hp_lost}`);
      if (stats.gold_gained > 0) contentParts.push(`获得 ${stats.gold_gained} 金币`);
      if (stats.gold_spent > 0) contentParts.push(`花费 ${stats.gold_spent} 金币`);
      contentParts.push(`结束生命 ${hp}，金币 ${gold}`);

      return {
        type,
        floor: floorNumber,
        act: actIndex + 1,
        mode: "normal",
        content: contentParts.join("，"),
        choice: unique([...picked, ...rewards]).join("、") || "无",
        skip: skipped.length ? skipped.join("、") : "无"
      };
    }

    function addCount(map, label) {
      if (!label) return;
      map.set(label, (map.get(label) || 0) + 1);
    }

    function formatCountList(map, showSingle = false) {
      return [...map.entries()].map(([name, count]) => showSingle || count > 1 ? `${name} ×${count}` : name);
    }

    function collectAll(data) {
      const relicMap = new Map();
      const cardMap = new Map();
      const player = data.players && data.players[0];

      if (player && Array.isArray(player.relics) && player.relics.length) {
        for (const x of player.relics) addCount(relicMap, t(x.id || x));
      }

      if (player && Array.isArray(player.deck) && player.deck.length) {
        for (const x of player.deck) addCount(cardMap, cardLabel(x));
      }

      const acts = data.map_point_history || [];
      for (const act of acts) {
        for (const node of act) {
          const stats = (node.player_stats && node.player_stats[0]) || {};
          if (!relicMap.size) {
            for (const x of stats.relic_choices || []) if (x.was_picked) addCount(relicMap, t(x.choice));
            for (const x of stats.bought_relics || []) addCount(relicMap, t(x));
          }
          if (!cardMap.size) {
            for (const x of stats.cards_gained || []) addCount(cardMap, cardLabel(x));
            for (const x of stats.card_choices || []) if (x.was_picked) addCount(cardMap, cardLabel(x.card));
            for (const x of stats.cards_transformed || []) addCount(cardMap, cardLabel(x.final_card));
          }
        }
      }
      return { relics: formatCountList(relicMap), cards: formatCountList(cardMap, true) };
    }

    function getCharacterName(data) {
      const player = data.players && data.players[0];
      return t(
        data.character_chosen ||
        data.player_character ||
        data.character ||
        data.player_class ||
        data.chosen_character ||
        data.class ||
        (player && (player.character || player.player_character || player.player_class)) ||
        "未知角色"
      );
    }

    function getSeed(data) {
      return data.seed_string || data.seed || data.play_id || "未知种子";
    }

    function isWin(data) {
      if (typeof data.win === "boolean") return data.win;
      if (typeof data.victory === "boolean") return data.victory;
      if (typeof data.is_victory === "boolean") return data.is_victory;
      if (data.killed_by_encounter && data.killed_by_encounter !== "NONE.NONE") return false;
      return (data.current_hp || data.final_hp || 0) > 0;
    }

    function finalHp(data) {
      const acts = data.map_point_history || [];
      const lastAct = acts[acts.length - 1] || [];
      const lastNode = lastAct[lastAct.length - 1] || {};
      const stats = (lastNode.player_stats && lastNode.player_stats[0]) || {};
      return `${stats.current_hp ?? data.final_hp ?? "?"}/${stats.max_hp ?? data.max_hp ?? "?"}`;
    }

    function renderStatus(data) {
      const win = isWin(data);
      $("statusLine").style.display = "grid";
      $("statusLine").innerHTML = `
        <div><span class="stat-label">种子</span><span class="stat-value seed">${escapeHtml(getSeed(data))}</span></div>
        <div><span class="stat-label">角色</span><span class="stat-value">${escapeHtml(getCharacterName(data))}</span></div>
        <div><span class="stat-label">最终血量</span><span class="stat-value hp">${escapeHtml(finalHp(data))}</span></div>
        <div><span class="stat-label">结果</span><span class="stat-value ${win ? "ok" : "fail"}">${win ? "成功" : "失败"}</span></div>
        <div><span class="stat-label">层数</span><span class="stat-value">${countFloors(data)}</span></div>
        <div></div>
      `;
    }

    function countFloors(data) {
      return (data.map_point_history || []).reduce((sum, act) => sum + act.length, 0);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch]));
    }

    function renderActs(data) {
      const acts = data.map_point_history || [];
      $("acts").style.display = "block";
      $("acts").innerHTML = "";
      let floor = 1;
      for (let i = 0; i < 3; i++) {
        const row = document.createElement("div");
        row.className = "act-row";
        const label = document.createElement("div");
        label.className = "act-name";
        label.textContent = `第 ${i + 1} 幕`;
        const nodes = document.createElement("div");
        nodes.className = "nodes";
        const actNodes = acts[i] || [];
        for (const node of actNodes) {
          const summary = summarizeNode(node, i, floor, data);
          const el = document.createElement("div");
          el.className = `node ${summary.type}`;
          el.textContent = ICONS[summary.type] || "•";
          el.dataset.tooltip = JSON.stringify(summary);
          el.addEventListener("mouseenter", showTooltip);
          el.addEventListener("mousemove", moveTooltip);
          el.addEventListener("mouseleave", hideTooltip);
          nodes.appendChild(el);
          floor++;
        }
        row.append(label, nodes);
        $("acts").appendChild(row);
      }
    }

    function showTooltip(e) {
      const data = JSON.parse(e.currentTarget.dataset.tooltip);
      let html = `<div class="floor">第${data.floor}层</div>`;
      if (data.mode === "event") {
        html += `
          <span class="k">事件：</span><span>${escapeHtml(data.event)}</span>

          <span class="k">选择了：</span><span class="choice">${escapeHtml(data.chose)}</span>

          <span class="k">奖励：</span><span class="choice">${escapeHtml(data.reward)}</span>

          <span class="k">失去：</span><span class="skip">${escapeHtml(data.lost)}</span>`;
      } else {
        html += `
          <span>${escapeHtml(data.content)}</span>

          <span class="k">选择：</span><span class="choice">${escapeHtml(data.choice)}</span>

          <span class="k">跳过：</span><span class="skip">${escapeHtml(data.skip)}</span>`;
      }
      const tip = $("tooltip");
      tip.innerHTML = html;
      tip.style.display = "block";
      moveTooltip(e);
    }

    function moveTooltip(e) {
      const tip = $("tooltip");
      const pad = 14;
      const rect = tip.getBoundingClientRect();
      let x = e.clientX + 16;
      let y = e.clientY + 16;
      if (x + rect.width > window.innerWidth - pad) x = e.clientX - rect.width - 16;
      if (y + rect.height > window.innerHeight - pad) y = window.innerHeight - rect.height - pad;
      tip.style.left = `${Math.max(pad, x)}px`;
      tip.style.top = `${Math.max(pad, y)}px`;
    }

    function hideTooltip() {
      $("tooltip").style.display = "none";
    }

    function renderCollections(data) {
      const { relics, cards } = collectAll(data);
      $("collections").style.display = "grid";
      $("relics").innerHTML = relics.length ? relics.map(x => `<span class="pill">${escapeHtml(x)}</span>`).join("") : `<span class="empty">无</span>`;
      $("cards").innerHTML = cards.length ? cards.map(x => `<span class="pill">${escapeHtml(x)}</span>`).join("") : `<span class="empty">无</span>`;
    }

    async function renderAll() {
      $("error").textContent = "";
      $("loading").style.display = "inline-flex";
      $("renderBtn").disabled = true;
      try {
        const runFile = $("runFile").files[0];
        if (!runFile) throw new Error("请先上传战报文件，或把文件拖到上传区域。 ");

        await new Promise(resolve => requestAnimationFrame(resolve));
        await loadTranslationFiles([]);
        const text = await readFileAsText(runFile);
        reportData = parseJsonLikeText(text);
        renderStatus(reportData);
        renderActs(reportData);
        renderCollections(reportData);

        document.querySelector(".uploader").style.display = "none";
        $("backBtn").style.display = "inline-block";
      } catch (err) {
        $("error").textContent = err.message || String(err);
        console.error(err);
      } finally {
        $("loading").style.display = "none";
        $("renderBtn").disabled = false;
      }
    }

    function setRunFile(file) {
      if (!file) return;
      const input = $("runFile");
      const dt = new DataTransfer();
      dt.items.add(file);
      input.files = dt.files;
      $("selectedFile").textContent = `已选择：${file.name}`;
    }

    const dropZone = $("dropZone");

    dropZone.addEventListener("click", (e) => {
      if (e.target.tagName !== "BUTTON" && e.target.tagName !== "INPUT") $("runFile").click();
    });

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      setRunFile(file);
      if (file) renderAll();
    });

    $("runFile").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      $("selectedFile").textContent = file ? `已选择：${file.name}` : "尚未选择文件";
    });

    $("backBtn").addEventListener("click", () => {
      document.querySelector(".uploader").style.display = "grid";
      $("backBtn").style.display = "none";
      $("statusLine").style.display = "none";
      $("acts").style.display = "none";
      $("collections").style.display = "none";
      $("tooltip").style.display = "none";
      $("error").textContent = "";
    });

    $("renderBtn").addEventListener("click", renderAll);
  </script>
</body>
</html>
